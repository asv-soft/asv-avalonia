name: Build and Release Example For Windows

on:
  push:
    tags:
      # Separate example release
      - 'example-v[0-9]+.[0-9]+.[0-9]+'
      - 'example-v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'
      - 'example-v[0-9]+.[0-9]+.[0-9]+-rc'
      # Shared NuGet, documentation, and example release
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc'

env:
  NUGET_SOURCE_URL: 'https://api.nuget.org/v3/index.json'
  GITHUB_PACKAGES_URL: 'https://nuget.pkg.github.com/asv-soft/index.json'
  PROJECT_NAME: 'Asv.Avalonia.Example'
  APP_PROJECT_NAME: 'Asv.Avalonia.Example.Desktop'
  LAUNCHER_PROJECT_NAME: 'Asv.Avalonia.Example.Launcher'
  PROPS_VERSION_VAR_NAME: 'ApiVersion'

jobs:
  build-and-release:
    runs-on: windows-latest
    concurrency:
      group: github-release-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x.x'

      - name: Add NuGet source
        run: dotnet nuget add source ${{ env.GITHUB_PACKAGES_URL }} --username '${{secrets.USER_NAME}}' --password '${{secrets.GIHUB_NUGET_AUTH_TOKEN}}' --store-password-in-clear-text      
      
      - name: Install dependencies
        run: |
          dotnet restore ./src/${{ env.PROJECT_NAME }}/${{ env.PROJECT_NAME }}.csproj
          dotnet restore ./src/${{ env.APP_PROJECT_NAME }}/${{ env.APP_PROJECT_NAME }}.csproj -r win-x64
          dotnet restore ./src/${{ env.LAUNCHER_PROJECT_NAME }}/${{ env.LAUNCHER_PROJECT_NAME }}.csproj -r win-x64

      - name: Build
        run: |
          dotnet build ./src/${{ env.PROJECT_NAME }}/${{ env.PROJECT_NAME }}.csproj --configuration Release --no-restore
          dotnet build ./src/${{ env.APP_PROJECT_NAME }}/${{ env.APP_PROJECT_NAME }}.csproj --configuration Release --no-restore
          dotnet build ./src/${{ env.LAUNCHER_PROJECT_NAME }}/${{ env.LAUNCHER_PROJECT_NAME }}.csproj --configuration Release --no-restore

      - name: Run tests
        run: dotnet test ./src/Asv.Avalonia.Test/Asv.Avalonia.Test.csproj --configuration Release

      - name: Set version variable
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = $env:TAG -replace '^(?:example-)?v', ''
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append


      - name: Publish app for installer
        run: dotnet publish ./src/${{ env.APP_PROJECT_NAME }}/${{ env.APP_PROJECT_NAME }}.csproj -c Release -r win-x64 --self-contained false --no-restore -o ./publish/app

      - name: Publish launcher for installer
        run: dotnet publish ./src/${{ env.LAUNCHER_PROJECT_NAME }}/${{ env.LAUNCHER_PROJECT_NAME }}.csproj -c Release -r win-x64 --self-contained false --no-restore -o ./publish/app
        
        # uncomment when real certificate is available
#      - name: Sign app files
#        uses: dlemstra/code-sign-action@v1
#        with:
#          certificate: '${{ secrets.WINDOWS_SIGNING_CERTIFICATE }}'
#          password: '${{ secrets.WINDOWS_SIGNING_PASSWORD }}'
#          folder: './publish/app'
#          recursive: true
#          description: 'Sign The App'
      
      - name: Install NSIS
        run: |
          choco install nsis

      #here you must define path to your .nsi file (it is used for installer setup and creation)
      - name: Create EXE installer
        uses: joncloud/makensis-action@v4
        with:
          script-file: win-64-install.nsi
        
        # uncomment when real certificate is available
#      - name: Sign the installer
#        uses: dlemstra/code-sign-action@v1
#        with:
#          certificate: '${{ secrets.WINDOWS_SIGNING_CERTIFICATE }}'
#          password: '${{ secrets.WINDOWS_SIGNING_PASSWORD }}'
#          files: |
#            AsvAvaloniaExampleInstaller.exe
#          description: 'Sign The Installer'      
      
      - name: List output files
        run: Get-ChildItem -Path ./publish/app -Force
        
      - name: Rename release asset
        run: Move-Item -LiteralPath './AsvAvaloniaExampleInstaller.exe' -Destination './asv-avalonia-example-${{ github.ref_name }}-setup-windows-64.exe'

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') }}
          files: ./asv-avalonia-example-${{ github.ref_name }}-setup-windows-64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GIHUB_NUGET_AUTH_TOKEN }}
